name: assemble-vendor
on:
  push:
    branches: [main]
    paths:
      - 'vendor/**'
      - '.github/workflows/assemble-vendor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble vendored libraries
        run: |
          set -euo pipefail
          if [ -f peerjs.min.js ] && [ -f js/qr.js ] && [ ! -f vendor/qr.js.gz.b64 ]; then
            echo "Vendored files already present"
            exit 0
          fi
          python3 - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path('vendor/qr.js.gz.b64')
          out = pathlib.Path('js/qr.js')
          out.write_bytes(gzip.decompress(base64.b64decode(src.read_text().encode('ascii'))))
          print('wrote', out, 'bytes', out.stat().st_size)
          PY
          curl -fsSL 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js' -o peerjs.min.js
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('peerjs.min.js').read_bytes()
          q = pathlib.Path('js/qr.js').read_bytes()
          print('peerjs', len(p), hashlib.sha256(p).hexdigest())
          print('qr', len(q), hashlib.sha256(q).hexdigest())
          assert len(p) == 86948, len(p)
          assert len(q) == 67037, len(q)
          PY
          rm -rf vendor
          rm -f .github/workflows/assemble-vendor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status
          git commit -m 'Add vendored PeerJS and QR libraries'
          git push
